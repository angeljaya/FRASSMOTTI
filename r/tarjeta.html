<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAFAF9"><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../js/tw.js"></script><link rel="stylesheet" href="../css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script><script src="../js/config.js"></script><script src="../js/secret.js"></script><script src="../js/diseno.js"></script><script src="../js/mensaje.js"></script><title>Tienes una tarjeta | Frassmotti</title><meta name="robots" content="noindex"><meta name="theme-color" content="#080a0f">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cinzel:wght@900&family=Kalam:wght@700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Pacifico&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/carta.css"><link rel="stylesheet" href="../css/extras.css"><link rel="stylesheet" href="../css/v14.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script></head>
<body class="carta-page"><div class="bg-glow"></div>
<header class="topbar"><a href="../index.html" class="pill"><i data-lucide="arrow-left"></i>Volver a la tienda</a><button class="pill" id="btnSound" aria-label="Sonido"><i data-lucide="volume-2"></i><span>Sonido</span></button></header>
<nav class="dock" id="dock" aria-label="Acciones de la tarjeta"><button class="pill" id="bSec" hidden><i data-lucide="lock"></i>Secreto</button><button class="pill" id="bTri"><i data-lucide="help-circle"></i>Trivia</button><button class="pill" id="sv"><i data-lucide="share-2"></i>Compartir</button><button class="pill" id="img"><i data-lucide="download"></i>Guardar imagen</button><button class="pill" id="mus" hidden><i data-lucide="music"></i>Música</button><a class="pill pill-accent" id="cr"><i data-lucide="plus"></i>Crear la mía</a></nav>
<div id="pv" class="hidden">Cargando tarjeta...</div>
<div class="viewport-3d"><div class="escena-wrapper"><div class="escena" id="escena"><div class="sobre-3d" id="sobre">
        <div class="env-back textura-papel"></div>
<div class="carta-3d" id="carta"><div class="carta-bg textura-papel"><div class="bg-text-pattern" id="pat"></div></div>
<div class="carta-content"><h1 class="scrapbook-title" id="tituloTxt"></h1><div class="letters-container" id="letrasCumple"></div>
<div class="photo-frame">              <svg class="sticker sticker-star-1" viewBox="0 0 100 100">
                <defs>
                  <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#b0b0b0"/>
                    <stop offset="100%" stop-color="#505050"/>
                  </linearGradient>
                </defs>
                <path d="M50 5 L61 35 L95 35 L68 55 L78 88 L50 68 L22 88 L32 55 L5 35 L39 35 Z" fill="url(#silver)" stroke="#fff" stroke-width="2"/>
              </svg>

<img id="av" class="photo-img" alt="Foto"><p class="photo-cap" id="cap"></p>
              <svg class="sticker sticker-flowers" viewBox="0 0 150 150">
                 <path d="M70 140 Q80 100 60 70 M75 140 Q90 100 110 80" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
                 <path d="M70 130 Q50 100 70 100 Q80 120 70 130 Z" fill="#d4af37"/>
                 <g transform="translate(55,65) scale(0.8) rotate(-10)">
                   <path d="M0 0 Q20 -30 40 0 Q20 30 0 0 Z M0 0 Q-20 -30 -40 0 Q-20 30 0 0 Z M0 0 Q30 20 0 40 Q-30 20 0 0 Z M0 0 Q30 -20 0 -40 Q-30 -20 0 0 Z" fill="#ff4d4d" stroke="#b31010" stroke-width="1"/>
                   <circle cx="0" cy="0" r="10" fill="#800000"/>
                   <circle cx="0" cy="0" r="5" fill="#330000"/>
                 </g>
                 <g transform="translate(105,75) scale(0.6) rotate(15)">
                   <path d="M0 0 Q20 -30 40 0 Q20 30 0 0 Z M0 0 Q-20 -30 -40 0 Q-20 30 0 0 Z M0 0 Q30 20 0 40 Q-30 20 0 0 Z M0 0 Q30 -20 0 -40 Q-30 -20 0 0 Z" fill="#ff6666" stroke="#b31010" stroke-width="1"/>
                   <circle cx="0" cy="0" r="10" fill="#800000"/>
                   <circle cx="0" cy="0" r="5" fill="#330000"/>
                 </g>
              </svg>
              
              <svg class="sticker sticker-star-2" viewBox="0 0 100 100">
                <path d="M50 5 L61 35 L95 35 L68 55 L78 88 L50 68 L22 88 L32 55 L5 35 L39 35 Z" fill="url(#silver)" stroke="#fff" stroke-width="2"/>
              </svg></div>
<p class="handwritten-msg" id="fraseTxt"><span id="typed"></span></p>
<div class="card-actions"><button class="btn-card btn-card-secondary" id="hide"><i data-lucide="mail"></i>Ocultar</button><button class="btn-card btn-card-primary" id="cel"><i data-lucide="sparkles"></i>Celebrar</button></div></div></div>
        <div class="env-pocket">
          <div class="flap-side izq textura-papel"></div>
          <div class="flap-side der textura-papel"></div>
          <div class="flap-bottom textura-papel"></div>
        </div>

        <div class="env-flap-top" id="flapTop">
          <div class="env-flap-bg textura-papel"></div>
          <div class="sello-container" id="selloWrap" onclick="abrirCarta()">
            <div class="sello-wax">
              <div class="sello-inner">
                <span class="sello-monogram" id="monogramTxt">C</span>
              </div>
            </div>
          </div>
        </div>
</div></div>
<p class="hint-text" id="hint"><i data-lucide="hand"></i> Rompe el sello</p></div></div>
<div id="mS" class="modal" role="dialog" aria-modal="true"><div id="sC" class="card p-7 w-full max-w-sm text-center relative"><button class="absolute top-4 right-4 text-gray-500" id="x" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
<div id="sL"><i data-lucide="lock" class="w-8 h-8 mx-auto text-accent"></i><h3 class="serif text-3xl mt-3">Adivina la clave</h3><p id="sH" class="text-gray-600 text-sm mt-2 whitespace-pre-line"></p><button type="button" id="sP" class="text-sm underline text-gray-700 mt-2" hidden>Pedir otra pista</button><input id="sG" class="input mt-5 text-center" placeholder="Escribe la clave" autocomplete="off"><p id="sE" class="text-sm text-accent mt-2 min-h-[1.25rem]"></p><button id="sT" class="btn btn-dark w-full mt-3">Abrir candado</button></div>
<div id="sO" class="hidden"><i data-lucide="heart" class="w-8 h-8 mx-auto text-accent"></i><h3 class="serif text-3xl mt-3">Secreto revelado</h3><p id="sM" class="text-gray-700 mt-3 whitespace-pre-line break-words"></p></div></div></div>

<div id="mT" class="modal" role="dialog" aria-modal="true"><div class="card p-7 w-full max-w-sm relative"><button class="absolute top-4 right-4 text-gray-500" data-x aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button><p class="eyebrow">Trivia</p><h2 id="q" class="serif text-2xl mt-1"></h2><div id="o" class="grid gap-2 mt-4"></div><p id="r" class="text-sm text-gray-600 mt-3 min-h-[1.25rem]"></p></div></div>
<div id="toast" class="toast" role="status"></div>
<script src="../js/tarjeta.js"></script>
<script>
(async () => {
  const urlParams = new URLSearchParams(location.search);
  const id = urlParams.get('id');

  if (!id) {
    alert("No se encontró ninguna tarjeta en este enlace.");
    return;
  }

  try {
    // 1. Consultar a tu Cloudflare Worker para obtener los datos usando el ID
    const respuesta = await fetch(`https://frassmotti.angelyujra97-7.workers.dev?id=${id}`);
    
    if (!respuesta.ok) {
      throw new Error("La tarjeta no existe o ya expiró.");
    }

    const PL = await respuesta.json();

    // 2. Extraer y procesar los datos devueltos por KV
    const q = new URLSearchParams();
    q.set('t', PL.plantilla || 'amor');
    q.set('g', PL.genero || 'm');
    q.set('d', PL.diseno || '');
    if (PL.color) q.set('color', PL.color);
    q.set('fu', PL.fuente || 'scrap');
    q.set('tam', PL.tamano || 1);

    const T = TV.find(q.get('t'));
    const nombre = clean(PL.nombre, 24) || 'Alguien especial';
    const frase = clean(PL.frase, 70) || T.frase;
    const col = TV.COLORS[q.get('color')] || T.K.ac;
    const de = clean(PL.deParte, 24);
    
    const msgLargo = PL.frase ? clean(PL.frase, 2600).trim() : '';
    const msgTxt = msgLargo || frase;
    const tam = TV.tam(q.get('tam')).id;
    const gen = q.get('g') === 'h' ? 'h' : 'm';
    
    const tit = clean(PL.titulo, 14) || T.ti;
    const pal = (clean(PL.palabra, 9) || T.pa).toUpperCase().slice(0, 9);
    
    TD.apply(document, { t: T, g: gen, dis: q.get('d'), col: q.get('color'), fu: q.get('fu'), v: 0 });
    document.title = 'Una tarjeta para ' + nombre + ' | Frassmotti';
    $('cr').href = '../personalizar.html?plantilla=' + T.id;
    
    const selloL = (clean(PL.sello, 1) || nombre).charAt(0).toUpperCase();
    $('tituloTxt').textContent = tit;
    TD.titleFit($('tituloTxt'), tit);$('monogramTxt').textContent = selloL;
    $('cap').textContent = nombre + (de ? ' · de ' + de : '');
    
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.textContent = (tit + ' ' + pal).toUpperCase();
      $('pat').append(s);
    }
    
    [...pal].forEach((ch, i) => {
      const d = document.createElement('div');
      d.className = 'circle-letter' + (i === 0 || i === Math.floor(pal.length / 1.5) ? ' red' : '');
      d.textContent = ch;
      d.style.transform = `translateY(${i % 2 ? 8 : 0}px) rotate(${(Math.random() * 20 - 10).toFixed(1)}deg)`;
      $('letrasCumple').append(d);
    });
    
    document.querySelectorAll('.circle-letter').forEach(d => {
      const z = Math.min(42, Math.floor((300 - (pal.length - 1) * 5) / pal.length));
      d.style.width = d.style.height = z + 'px';
      d.style.fontSize = Math.round(z * .57) + 'px';
    });

    const hasPhoto = PL.foto && PL.foto.startsWith('data:image/');
    $('av').onerror = function() { this.onerror = null; this.src = TV.avatar(1, nombre); };$('av').src = hasPhoto ? PL.foto : TV.avatar(1, nombre);
    $('av').classList.toggle('color', !hasPhoto || PL.bw !== false);
    
    TM.mount($('fraseTxt'), msgTxt, tam, { keepText: true });
    
    const lift = () => $('carta').style.setProperty('--lift', Math.max(0,$('carta').offsetHeight - 520) + 'px');
    lift();
    addEventListener('load', lift);
    document.fonts && document.fonts.ready.then(lift);

    const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); setTimeout(() =>$('toast').classList.remove('show'), 2600); };
    const boom = () => confetti({ particleCount: 120, spread: 90, origin: { y: .6 }, colors: ['#d4af37', '#fff1b0', '#cc1111', '#ffffff', '#000000'], ticks: 220, disableForReducedMotion: true });
    
    let estado = 'cerrado', typedOk = false;
    const startTyped = () => { if (typedOk) return; typedOk = true; (tam === 1 ? new Typed('#typed', { strings: [msgTxt], typeSpeed: msgTxt.length > 140 ? 14 : 42, showCursor: false, contentType: 'text' }) : 0); };

    if (TV.MUSIC) {
      const a = new Audio(TV.MUSIC);
      a.loop = true;
      $('mus').hidden = false;
      $('mus').onclick = () => { a.paused ? a.play() : a.pause(); };
      window.__mus = a;
    }

    let soundEnabled = true;
    $('btnSound').onclick = () => {
      soundEnabled = !soundEnabled;
      $('btnSound').innerHTML = '<i data-lucide="' + (soundEnabled ? 'volume-2' : 'volume-x') + '"></i><span>' + (soundEnabled ? 'Sonido' : 'Mudo') + '</span>';
      lucide.createIcons();
    };

    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.classList.remove('open'); }));

    window.abrirCarta = function() {
      if (estado === 'abierto') return;
      estado = 'abierto';
      playWaxCrackSound();
      setTimeout(() => { escena.classList.add('abierto'); playPaperSlideSound(); }, 150);
      setTimeout(() => { playChimeSound(); boom(); startTyped(); $('dock').classList.add('show'); window.__mus && window.__mus.play().catch(() => {}); }, 1000);
      navigator.vibrate && navigator.vibrate([30, 40, 30]);
    };

    function cerrarCarta(e) {
      if (e) e.stopPropagation();
      if (estado === 'cerrado') return;
      estado = 'cerrado';
      escena.classList.remove('abierto');
      $('dock').classList.remove('show');
      playPaperSlideSound();
    }

    $('hide').onclick = cerrarCarta;
    $('cel').onclick = e => { e.stopPropagation(); boom(); };
    $('bTri').onclick = () =>$('mT').classList.add('open');

    // Manejo de Secreto / Candado
    if (PL.secreto || PL.clave) {
      $('bSec').hidden = false;
    }
    
    let tries = 0;
    const HINTS = [].concat(PL.pistas || []).map(x => clean(x, 60).trim()).filter(Boolean);
    let hs = 1;
    
    const paintH = () => {
      $('sH').textContent = HINTS.length ? HINTS.slice(0, hs).map((h, i) => (HINTS.length > 1 ? 'Pista ' + (i + 1) + ': ' : 'Pista: ') + h).join('\n') : 'Piensa en lo que los une...';
      $('sP').hidden = hs >= HINTS.length;
    };
    
    $('sP').onclick = () => { hs++; paintH(); };
    
    const reveal = m => {
      $('sL').classList.add('hidden');
      $('sO').classList.remove('hidden');$('sM').textContent = m;
      boom();
      TVS.chime();
    };

    $('bSec').onclick = () => {
      $('sG').value = '';$('sE').textContent = '';
      $('sO').classList.add('hidden');$('mS').classList.add('open');
      if (!PL.clave) {
        reveal(PL.secreto);
        return;
      }
      $('sL').classList.remove('hidden');
      hs = 1;
      paintH();
      setTimeout(() => $('sG').focus(), 150);
    };

    async function guess() {
      const g = $('sG').value.trim().toLowerCase();
      const claveReal = (PL.clave || '').trim().toLowerCase();
      
      if (g && g === claveReal) {
        reveal(PL.secreto);
        return;
      }
      
      tries++;
      const more = hs < HINTS.length;
      if (more) { hs++; paintH(); }
      $('sE').textContent = (tries >= 2 ? 'Sigue intentando, lee bien la pista.' : 'Esa no es la clave. Intenta otra vez.') + (more ? ' Te damos otra pista.' : '');
      const c = $('sC');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
      $('sG').value = '';$('sG').focus();
    }

    $('sT').onclick = guess;
    $('sG').onkeydown = e => { if (e.key === 'Enter') guess(); };
    $('x').onclick = () =>$('mS').classList.remove('open');
    $('mS').onclick = e => { if (e.target.id === 'mS')$('mS').classList.remove('open'); };

    // Trivia
    $('q').textContent = T.q.replaceAll('{n}', nombre);
    let answered = false;
    T.o.forEach((x, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.textContent = x.replaceAll('{n}', nombre);
      b.onclick = () => {
        if (answered) return;
        answered = true;
        [...$('o').children].forEach((y, j) => { y.disabled = true; if (j === T.ok) y.classList.add('ok'); });
        if (i !== T.ok) b.classList.add('bad');
        $('r').textContent = i === T.ok ? 'Correcto. Esa es la respuesta.' : 'Casi. Pero tú ya sabes la verdad.';
        if (i === T.ok) boom();
      };
      $('o').append(b);
    });

    $('sv').onclick = async () => {
      try {
        if (navigator.share) await navigator.share({ title: 'tarjeta FRASSMOTTI', text: 'Mira mi tarjetita para ' + nombre, url: location.href });
        else { await navigator.clipboard.writeText(location.href); toast('Link copiado'); }
      } catch (e) {}
    };

    lucide.createIcons();

  } catch (error) {
    console.error(error);
    alert("No se pudo cargar la tarjeta. Es posible que el enlace haya expirado o sea incorrecto.");
  }
})();
</script>
<script src="../js/extras.js"></script><script src="../js/nuevas.js"></script></body></html>
